name: Test basic ArgoCD CLI install (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: version
          options: --client
      - name: Assert output contains version info
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qi "argocd"; then
            echo "FAIL: output does not mention argocd"
            exit 1
          fi
          echo "PASS: output contains argocd version info"
      - name: Assert argocd binary is on PATH
        run: |
          if ! command -v argocd >/dev/null 2>&1; then
            echo "FAIL: argocd binary not found on PATH"
            exit 1
          fi
          echo "PASS: argocd binary found at $(command -v argocd)"
