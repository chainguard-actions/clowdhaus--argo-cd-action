name: Test basic ArgoCD CLI install (default version)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ArgoCD CLI (default version, no command)
        id: action
        uses: .
        # No command or options — just install

      - name: Assert argocd binary is on PATH
        run: |
          echo "Checking argocd binary is available..."
          if ! command -v argocd >/dev/null 2>&1; then
            echo "FAIL: argocd binary not found on PATH"
            exit 1
          fi
          echo "PASS: argocd binary found at $(command -v argocd)"

      - name: Assert output is empty when no command given
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual output: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty output when no command given, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: output is empty as expected"
