name: Test ArgoCD CLI version command
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run argocd version --client
        id: action
        uses: .
        with:
          command: version
          options: --client

      - name: Assert output contains version info
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual output: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty output from version command"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qi "argocd"; then
            echo "FAIL: expected output to contain 'argocd', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version output contains expected content"

      - name: Assert argocd binary is on PATH after command
        run: |
          if ! command -v argocd >/dev/null 2>&1; then
            echo "FAIL: argocd binary not found on PATH"
            exit 1
          fi
          echo "PASS: argocd binary found at $(command -v argocd)"
