name: Test install only - no command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 3.3.2
      - name: Assert argocd binary is available on PATH
        run: |
          if ! command -v argocd >/dev/null 2>&1; then
            echo "FAIL: argocd binary not found on PATH"
            exit 1
          fi
          echo "PASS: argocd binary is available"
          argocd version --client
