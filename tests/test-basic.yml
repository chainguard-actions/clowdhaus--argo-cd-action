name: Test basic usage - install default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert argocd CLI is installed
        run: |
          echo "Checking argocd CLI is available..."
          if ! command -v argocd &>/dev/null; then
            echo "FAIL: argocd CLI not found in PATH"
            exit 1
          fi
          echo "PASS: argocd CLI is available"
          argocd version --client
