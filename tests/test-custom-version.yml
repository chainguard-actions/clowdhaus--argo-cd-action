name: Test ArgoCD CLI custom version install
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ArgoCD CLI at specific version
        id: action
        uses: .
        with:
          version: 2.13.4
          command: version
          options: --client

      - name: Assert output contains expected version
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual output: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty output from version command"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "2.13.4"; then
            echo "FAIL: expected output to contain version '2.13.4', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version output contains expected version 2.13.4"
