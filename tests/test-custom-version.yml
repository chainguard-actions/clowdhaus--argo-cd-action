name: Test custom version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 2.13.3
          command: version
          options: --client
      - name: Assert output contains expected version
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "2.13.3"; then
            echo "FAIL: expected version 2.13.3 in output, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: correct version installed"
