name: Test custom download URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 2.12.0
          download-url: https://github.com/argoproj/argo-cd/releases/download/v2.12.0/argocd-linux-amd64
          command: version
          options: --client
      - name: Assert output contains version from custom URL
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qi "argocd\|version\|BuildDate\|GitCommit\|v2"; then
            echo "FAIL: output does not look like ArgoCD version info"
            exit 1
          fi
          echo "PASS: custom download URL worked, got version output"
